name: Translate Shell Check Reusable

on:
  pull_request:
    paths:
      - ".github/scripts/i18n/**"
      - ".github/workflows/translate-*.yml"
      - ".openclaw-sync/**"
      - "package.json"
      - "package-lock.json"
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    name: Check workflow shell blocks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Check bash syntax in translation workflows
        run: |
          set -euo pipefail

          python .github/scripts/i18n/workflow_shell_check.py --check-bash

      - name: Install locked dependencies
        run: npm ci

      - name: Run i18n control-plane regressions
        run: |
          set -euo pipefail

          python .github/scripts/i18n/tests/test_i18n_scripts.py

      - name: Check translation workflow budgets
        run: |
          set -euo pipefail

          python .github/scripts/i18n/budget_check.py
