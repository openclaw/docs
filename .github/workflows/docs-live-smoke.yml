name: Docs Live Smoke

on:
  workflow_dispatch:
    inputs:
      commit_range:
        description: "Optional <base>..<head> git range; docs pages added within it are asserted live in addition to the fixed probes."
        type: string
        required: false
        default: ""
  schedule:
    - cron: "23 6 * * *"

permissions:
  contents: read

concurrency:
  group: docs-live-smoke-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Derive newly added routes
        id: added-routes
        if: inputs.commit_range != ''
        env:
          COMMIT_RANGE: ${{ inputs.commit_range }}
        run: |
          set -euo pipefail
          if [[ ! "${COMMIT_RANGE}" =~ ^[0-9a-f]{7,40}\.\.[0-9a-f]{7,40}$ ]]; then
            echo "Invalid commit_range: expected <base>..<head> with 7-40 lowercase hex characters per commit." >&2
            exit 1
          fi
          base="${COMMIT_RANGE%%..*}"
          head="${COMMIT_RANGE##*..}"
          git fetch --quiet --no-tags --depth=1 origin "${base}" "${head}"
          git diff --name-only --no-renames --diff-filter=A "${base}" "${head}" -- docs | node scripts/docs-site/added-routes.mjs > /tmp/openclaw-added-routes.txt
          echo "Newly added routes:"
          if [ -s /tmp/openclaw-added-routes.txt ]; then
            cat /tmp/openclaw-added-routes.txt
          else
            echo "none"
          fi

      - name: Smoke live docs pages
        env:
          BASE_URL: https://docs.openclaw.ai
          GITHUB_SHA: ${{ github.sha }}
          EXTRA_PAGES_FILE: /tmp/openclaw-added-routes.txt
          PAGES: |
            /tools/reactions
            /plugins/google-meet
            /zh-CN/tools/reactions
            /de/tools/reactions
            /de/gateway/heartbeat
        run: |
          node - <<'NODE'
          const baseUrl = process.env.BASE_URL;
          const pages = (process.env.PAGES ?? "")
            .split(/\r?\n/)
            .map((line) => line.trim())
            .filter(Boolean);
          const fs = await import("node:fs");
          const extraPagesFile = process.env.EXTRA_PAGES_FILE;
          const fixedPageCount = pages.length;
          if (extraPagesFile && fs.existsSync(extraPagesFile)) {
            const extraPages = fs.readFileSync(extraPagesFile, "utf8")
              .split(/\r?\n/)
              .map((line) => line.trim())
              .filter(Boolean);
            for (const page of extraPages) {
              if (!pages.includes(page)) pages.push(page);
            }
          }
          console.log(`Added ${pages.length - fixedPageCount} extra routes.`);
          const poison = [
            /\banalysis\s+to=functions\./iu,
            /\b(?:commentary|final)\s+to=functions\./iu,
            /\bfunctions\.(?:read|write|exec|search|run)\b/iu,
            /\b[A-Za-z_\u3400-\u9fff][\w\u3400-\u9fff-]*_input=\{/u,
            /<\/?openclaw_docs_i18n_input>/iu,
            /\/home\/runner\/work\//u,
            /彩神马争霸/u,
          ];
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          const titleOf = (html) => {
            const match = html.match(/<title[^>]*>([\s\S]*?)<\/title>/i);
            return match ? match[1].replace(/\s+/g, " ").trim() : "";
          };
          const decode = (value) =>
            value
              .replaceAll("&amp;", "&")
              .replaceAll("&lt;", "<")
              .replaceAll("&gt;", ">")
              .replaceAll("&quot;", '"')
              .replaceAll("&#x27;", "'")
              .replaceAll("&#39;", "'");
          const assertPage = async (path, attempt) => {
            const url = new URL(path, baseUrl);
            url.searchParams.set("_openclaw_smoke", `${process.env.GITHUB_SHA}-${attempt}`);
            const response = await fetch(url, {
              headers: {
                "cache-control": "no-cache",
                pragma: "no-cache",
              },
            });
            if (!response.ok) {
              throw new Error(`${path}: HTTP ${response.status}`);
            }
            const html = await response.text();
            const title = decode(titleOf(html));
            if (!title || title.includes("404") || title.includes("Not Found")) {
              throw new Error(`${path}: bad title ${JSON.stringify(title)}`);
            }
            for (const pattern of poison) {
              if (pattern.test(html) || pattern.test(title)) {
                throw new Error(`${path}: poison text matched ${pattern}`);
              }
            }
            console.log(`${path}: ok (${title})`);
          };
          const assertMarkdown = async (path) => {
            const url = new URL(path, baseUrl);
            const response = await fetch(url, {
              headers: {
                accept: "text/markdown",
                "cache-control": "no-cache",
                pragma: "no-cache",
              },
            });
            if (!response.ok) throw new Error(`${path}: markdown HTTP ${response.status}`);
            const text = await response.text();
            const contentType = response.headers.get("content-type") ?? "";
            if (!contentType.includes("text/markdown")) {
              throw new Error(`${path}: expected markdown content-type, got ${contentType}`);
            }
            if (!/^---\n/m.test(text)) throw new Error(`${path}: markdown frontmatter missing`);
            console.log(`${path}: ok (markdown)`);
          };
          const assertText = async (path, pattern) => {
            const url = new URL(path, baseUrl);
            url.searchParams.set("_openclaw_smoke", process.env.GITHUB_SHA);
            const response = await fetch(url, {
              headers: {
                "cache-control": "no-cache",
                pragma: "no-cache",
              },
            });
            if (!response.ok) throw new Error(`${path}: text HTTP ${response.status}`);
            const text = await response.text();
            const contentType = response.headers.get("content-type") ?? "";
            if (!/text\/plain|text\/markdown|application\/xml/.test(contentType)) {
              throw new Error(`${path}: unexpected content-type ${contentType}`);
            }
            if (!pattern.test(text)) throw new Error(`${path}: expected marker missing`);
            console.log(`${path}: ok (${contentType})`);
          };
          const assertSearch = async () => {
            const url = new URL("/api/search", baseUrl);
            url.searchParams.set("q", "heartbeat");
            url.searchParams.set("_openclaw_smoke", process.env.GITHUB_SHA);
            const response = await fetch(url, {
              headers: {
                accept: "application/json",
                "cache-control": "no-cache",
                pragma: "no-cache",
              },
            });
            if (!response.ok) throw new Error(`/api/search: HTTP ${response.status}`);
            const contentType = response.headers.get("content-type") ?? "";
            if (!contentType.includes("application/json")) {
              throw new Error(`/api/search: expected JSON content-type, got ${contentType}`);
            }
            const payload = await response.json();
            if (!Array.isArray(payload.results) || payload.results.length === 0) {
              throw new Error("/api/search: no heartbeat results");
            }
            if (!payload.results.some((entry) => /heartbeat/i.test(`${entry.title} ${entry.snippet ?? ""}`))) {
              throw new Error("/api/search: heartbeat marker missing from results");
            }
            console.log("/api/search: ok");
          };
          const assertLegacyMcpSearch = async () => {
            const response = await fetch(new URL("/mcp", baseUrl), {
              method: "POST",
              headers: {
                accept: "application/json",
                "cache-control": "no-cache",
                "content-type": "application/json",
                pragma: "no-cache",
              },
              body: JSON.stringify({
                jsonrpc: "2.0",
                id: 1,
                method: "tools/call",
                params: {
                  name: "search_open_claw",
                  arguments: { query: "heartbeat" },
                },
              }),
            });
            if (!response.ok) throw new Error(`/mcp: HTTP ${response.status}`);
            const payload = await response.json();
            const text = payload?.result?.content?.[0]?.text ?? "";
            if (!/Title: .+heartbeat|Content: .+heartbeat/i.test(text)) {
              throw new Error("/mcp: heartbeat marker missing from legacy MCP output");
            }
            console.log("/mcp: ok");
          };
          const assertHeader = async (path, name, required, forbidden) => {
            const response = await fetch(new URL(path, baseUrl), {
              method: "HEAD",
              headers: {
                "cache-control": "no-cache",
                pragma: "no-cache",
              },
            });
            if (!response.ok) throw new Error(`${path}: header HTTP ${response.status}`);
            const value = response.headers.get(name) ?? "";
            if (!required.test(value)) throw new Error(`${path}: ${name} missing expected value, got ${value}`);
            if (forbidden?.test(value)) throw new Error(`${path}: ${name} has forbidden value, got ${value}`);
            console.log(`${path}: ok (${name}: ${value})`);
          };
          const deadline = Date.now() + 20 * 60 * 1000;
          let lastError;
          for (let attempt = 1; Date.now() < deadline; attempt += 1) {
            try {
              for (const page of pages) {
                await assertPage(page, attempt);
              }
              await assertMarkdown("/concepts/models");
              await assertHeader("/concepts/models", "link", /<\/concepts\/models\.md>; rel="alternate"; type="text\/markdown"/);
              await assertText("/robots.txt", /Sitemap: .*\/sitemap\.xml/);
              await assertText("/llms.txt", /## Documentation Index/);
              await assertText("/.well-known/llms.txt", /## Documentation Index/);
              await assertText("/sitemap.xml", /<urlset/);
              await assertSearch();
              await assertLegacyMcpSearch();
              await assertHeader("/sitemap.xml", "cache-control", /max-age=300/, /immutable/);
              await assertHeader("/assets/docs-site.css", "cache-control", /max-age=60/, /immutable/);
              await assertHeader("/assets/docs-site.css", "cloudflare-cdn-cache-control", /s-maxage=3600/, /immutable/);
              process.exit(0);
            } catch (error) {
              lastError = error;
              console.log(`Attempt ${attempt} failed: ${error.message}`);
              await sleep(Math.min(15_000 * attempt, 60_000));
            }
          }
          throw lastError ?? new Error("Docs live smoke timed out.");
          NODE

  # docs_map.md covers English routes only; locale coverage comes from the per-dispatch added-route assertions.
  sample:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v7.0.1
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Sample live docs routes
        env:
          BASE_URL: https://docs.openclaw.ai
        run: |
          node - <<'NODE'
          import fs from "node:fs";

          const routes = [...new Set(fs.readFileSync("docs/docs_map.md", "utf8")
            .split(/\r?\n/)
            .map((line) => line.match(/^- Route: (\/\S*)$/)?.[1])
            .filter(Boolean))].sort();
          if (routes.length < 100) {
            throw new Error(`Expected at least 100 docs_map.md routes, parsed ${routes.length}.`);
          }
          const runId = process.env.GITHUB_RUN_ID;
          let seed = Number(BigInt(runId) & 0xffffffffn);
          for (let index = routes.length - 1; index > 0; index -= 1) {
            seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0;
            const other = Math.floor(seed / 0x100000000 * (index + 1));
            [routes[index], routes[other]] = [routes[other], routes[index]];
          }
          const pages = routes.slice(0, 25);
          console.log(`Sampling ${pages.length} of ${routes.length} routes for run ${runId}:\n${pages.join("\n")}`);
          const baseUrl = process.env.BASE_URL;
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          const titleOf = (html) => {
            const match = html.match(/<title[^>]*>([\s\S]*?)<\/title>/i);
            return match ? match[1].replace(/\s+/g, " ").trim() : "";
          };
          const decode = (value) =>
            value
              .replaceAll("&amp;", "&")
              .replaceAll("&lt;", "<")
              .replaceAll("&gt;", ">")
              .replaceAll("&quot;", '"')
              .replaceAll("&#x27;", "'")
              .replaceAll("&#39;", "'");
          const assertPage = async (path, attempt) => {
            const url = new URL(path, baseUrl);
            url.searchParams.set("_openclaw_smoke", `${process.env.GITHUB_SHA}-${attempt}`);
            const response = await fetch(url, {
              headers: {
                "cache-control": "no-cache",
                pragma: "no-cache",
              },
              signal: AbortSignal.timeout(15_000),
            });
            if (!response.ok) {
              throw new Error(`${path}: HTTP ${response.status}`);
            }
            const html = await response.text();
            const title = decode(titleOf(html));
            if (!title || title.includes("404") || title.includes("Not Found")) {
              throw new Error(`${path}: bad title ${JSON.stringify(title)}`);
            }
            console.log(`${path}: ok (${title})`);
          };
          let pending = pages;
          for (let attempt = 1; attempt <= 3; attempt += 1) {
            const failures = [];
            for (const page of pending) {
              try {
                await assertPage(page, attempt);
              } catch (error) {
                failures.push({ page, message: error.message });
                console.log(`Attempt ${attempt} failed: ${error.message}`);
              }
            }
            if (failures.length === 0) break;
            if (attempt === 3) {
              throw new Error(`Docs route sample failed:\n${failures.map(({ message }) => message).join("\n")}`);
            }
            pending = failures.map(({ page }) => page);
            await sleep(5_000);
          }
          NODE
