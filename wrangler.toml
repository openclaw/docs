name = "openclaw-docs-router"
main = "workers/docs-router.ts"
compatibility_date = "2026-05-06"
routes = [
  { pattern = "docs.openclaw.ai/*", zone_name = "openclaw.ai" },
  { pattern = "documentation.openclaw.ai/*", zone_name = "openclaw.ai" }
]

[observability]
redact_query_string = true

[observability.logs]
enabled = true
head_sampling_rate = 1
# Keep failure logs without storing an invocation record for every request.
invocation_logs = false

[observability.traces]
enabled = false

[[r2_buckets]]
binding = "DOCS_BUCKET"
bucket_name = "openclaw-docs"
